name: ghasum
description: Verify checksums of actions

inputs:
  checksum:
    description: The checksum of the ghasum checksums file
    required: false
    default: sha256:ea8d55ff6d1a0a733a499f52594e25841038e65de1f45986cb0eea3ecd011c34
  mode:
    description: Whether to 'verify' checksums or just 'install' ghasum
    required: false
    default: verify
  version:
    description: The version of ghasum to use
    required: false
    default: v0.6.3

runs:
  using: composite
  steps:
    - name: Validate input 'mode'
      if: inputs.mode != 'verify' && inputs.mode != 'install'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "mode must be 'verify' or 'install', got: $MODE"
        exit 1

    # macOS
    - name: Verify the action checksums
      if: runner.os == 'macOS' && inputs.mode == 'verify'
      shell: bash
      env:
        JOB: ${{ github.job }}
        WORKFLOW: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        WORKFLOW=$(echo "${WORKFLOW}" | cut -d '@' -f 1 | cut -d '/' -f 3-5)
        go run github.com/chains-project/ghasum/cmd/ghasum@latest verify \
          -cache /Users/runner/work/_actions -no-evict -offline "${WORKFLOW}:${JOB}"

    # Linux
    - name: Verify the action checksums
      if: runner.os == 'Linux' && inputs.mode == 'verify'
      shell: bash
      env:
        JOB: ${{ github.job }}
        WORKFLOW: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        WORKFLOW=$(echo "${WORKFLOW}" | cut -d '@' -f 1 | cut -d '/' -f 3-5)
        go run github.com/chains-project/ghasum/cmd/ghasum@latest verify \
          -cache /home/runner/work/_actions -no-evict -offline "${WORKFLOW}:${JOB}"

    # Windows
    - name: Verify the action checksums
      if: runner.os == 'Windows' && inputs.mode == 'verify'
      shell: pwsh
      env:
        JOB: ${{ github.job }}
        WORKFLOW: ${{ github.workflow_ref }}
      run: |
        $WorkflowParts = $env:WORKFLOW -split '@'
        $WorkflowPath = ($WorkflowParts[0] -split '/')[2..4] -join '/'
        if (Test-Path -Path 'C:\a\_actions') {
          go run github.com/chains-project/ghasum/cmd/ghasum verify -cache C:\a\_actions -no-evict -offline "${WorkflowPath}:$env:JOB"
        } else {
          go run github.com/chains-project/ghasum/cmd/ghasum verify -cache D:\a\_actions -no-evict -offline "${WorkflowPath}:$env:JOB"
        }

    # Invalidate actions
    - name: Remove actions
      if: failure() && runner.os == 'Linux'
      shell: bash
      run: rm -rf /home/runner/work/_actions
    - name: Remove actions
      if: failure() && runner.os == 'macOS'
      shell: bash
      run: rm -rf /Users/runner/work/_actions
    - name: Remove actions
      if: failure() && runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path -Path 'C:\a\_actions') {
          Remove-Item -Recurse -Force -Path C:\a\_actions
        } else {
          Remove-Item -Recurse -Force -Path D:\a\_actions
        }
